name: Keep Alive Streamlit

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # a cada 15 min, fora dos minutos :00/:15 (horários de pico em que o GitHub mais atrasa/pula)
  workflow_dispatch:         # botão "Run workflow" para testar na hora
  push:
    branches: [main]         # sempre que você enviar arquivos novos, ele também confere o app

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Acordar o app Streamlit
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python .github/scripts/acordar_app.py
