name: Keep Alive Streamlit

on:
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Wake up Streamlit app
        run: |
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  await page.goto("https://luzeletras.streamlit.app/", timeout=60000)
                  
                  # Tenta clicar no botão se o app estiver dormindo
                  try:
                      btn = page.locator("text=Yes, get this app back up!")
                      await btn.click(timeout=10000)
                      print("App estava dormindo — acordei!")
                      await page.wait_for_timeout(15000)
                  except:
                      print("App já estava acordado.")
                  
                  await browser.close()

          asyncio.run(main())
          EOF
